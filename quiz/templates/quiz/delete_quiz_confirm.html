{% extends 'quiz/base.html' %}
{% block title %}Delete Quiz{% endblock %}

{% block content %}
<h1>Delete Quiz</h1>
<p>Are you sure you want to delete <strong>{{ quiz.title }}</strong>?
   This will remove all questions and results. This cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <div class="action-row mt-1">
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'quiz_detail' quiz.id %}" class="back-link">Cancel</a>
    </div>
</form>
{% endblock %}
