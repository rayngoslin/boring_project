{% extends 'quiz/base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Register</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign Up</button>
        </form>
        <p class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Login</a>
        </p>
    </div>
</div>
{% endblock %}
